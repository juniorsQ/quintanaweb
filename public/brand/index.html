<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuintanaDev — Logo y wallpaper oficial</title>
    <meta
      name="description"
      content="Kit de marca QuintanaDev: logo, favicon y wallpaper para Open Graph, Google y redes."
    />
    <link rel="canonical" href="https://og.quintanadev.us/" />
    <meta property="og:title" content="QuintanaDev — Brand kit" />
    <meta
      property="og:description"
      content="Logo y wallpaper oficial de QuintanaDev."
    />
    <meta property="og:image" content="https://og.quintanadev.us/og.jpg" />
    <meta property="og:url" content="https://og.quintanadev.us/" />
    <meta name="robots" content="index,follow" />
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #04140c;
        color: #d7ffe6;
        padding: 32px;
      }
      img {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 16px 0;
      }
      a {
        color: #3dff7a;
      }
    </style>
  </head>
  <body>
    <h1>QuintanaDev</h1>
    <p>
      Identidad visual de
      <a href="https://quintanadev.us">quintanadev.us</a> — software fullstack,
      POS y sistemas de pago.
    </p>
    <h2>Logo</h2>
    <img src="/logo.png" width="320" height="320" alt="Logo oficial QuintanaDev" />
    <h2>Open Graph</h2>
    <img
      src="/og.jpg"
      width="1200"
      height="630"
      alt="QuintanaDev — wallpaper y logo para buscadores y redes sociales"
    />
    <h2>Wallpaper</h2>
    <img
      src="/wallpaper.jpg"
      width="1920"
      height="1080"
      alt="Wallpaper QuintanaDev agency, desarrollo de software y apps"
    />
