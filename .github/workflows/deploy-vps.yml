name: Deploy quintanadev.us

on:
  push:
    branches: ["main", "feature/retro-nasa-cms"]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload site to DigitalOcean VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 24.144.117.167
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "out/*"
          target: /var/www/quintanadev
          strip_components: 1
          overwrite: true
          rm: true

      - name: Fix permissions
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 24.144.117.167
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            chown -R www-data:www-data /var/www/quintanadev
            find /var/www/quintanadev -type d -exec chmod 755 {} \;
            find /var/www/quintanadev -type f -exec chmod 644 {} \;
